# mq-project broker configuration (INI format)
bind_address = 127.0.0.1
bind_port = 9092
data_dir = data
sub_reactor_threads = 0
segment_size = 64Mi
retention_hours = 168
produce_rate_limit = 0
# 每个 Topic 每秒允许的 key/value 字节数，0 表示不限额
topic_produce_quota_bytes = 0
log_file = data/broker.log
node_id = node-local
replica_role = leader
# 配置后所有普通客户端请求必须携带该 Token；留空表示兼容未鉴权模式
# client_auth_token = replace-with-a-long-random-secret
# client_auth_permissions = admin,produce,consume
# client_auth_produce_topics = orders,events
# client_auth_consume_topics = orders,events
# TLS 启用后必须同时配置证书和私钥；未启用时保持明文兼容
# tls_enabled = false
# tls_certificate_file = conf/server.crt
# tls_private_key_file = conf/server.key
# tls_ca_file = conf/ca.crt
# tls_require_client_certificate = false
# replica_peers = node-follower:127.0.0.1:9093
# replication_auth_token = replace-with-a-long-random-secret
